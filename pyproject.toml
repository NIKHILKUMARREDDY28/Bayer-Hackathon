[project]
name = "bayer-hackathon-final"
version = "0.1.0"
description = "Autonomous Incident Commander - Multi-Agent AIOps System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "streamlit>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "resend>=2.0.0",
]

[project.scripts]
run-streamlit = "streamlit:run"
